<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Map | Austria Tourism</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for the Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root { --red: #c8102e; --ink: #1d2024; --cream: #fffaf5; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: "DM Sans", sans-serif; background-color: var(--ink); overflow: hidden; }
        
        /* The Map Container */
        #map { width: 100%; height: 100vh; z-index: 1; }

        /* Custom UI Overlay */
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; display: flex; justify-content: space-between; padding: 30px 4vw; }
        
        .header-panel { pointer-events: auto; background: rgba(29, 32, 36, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 20px 30px; border-radius: 16px; color: white; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .header-panel h1 { font-family: "Playfair Display", serif; margin: 0 0 5px 0; font-size: 24px; }
        .header-panel p { margin: 0; font-size: 13px; color: rgba(255,255,255,0.7); }

        .btn-back { pointer-events: auto; background: var(--cream); color: var(--ink); padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: transform 0.2s; height: fit-content; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-back:hover { transform: translateY(-2px); }

        /* Now Playing Widget */
        .now-playing { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); pointer-events: auto; background: rgba(200, 16, 46, 0.95); backdrop-filter: blur(12px); color: white; padding: 15px 30px; border-radius: 50px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(200, 16, 46, 0.4); opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; transform: translate(-50%, 20px); }
        .now-playing.active { opacity: 1; transform: translate(-50%, 0); }
        .sound-wave { display: flex; gap: 3px; height: 20px; align-items: flex-end; }
        .bar { width: 4px; background: white; border-radius: 2px; animation: wave 1s ease-in-out infinite; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        
        @keyframes wave { 0%, 100% { height: 4px; } 50% { height: 20px; } }

        /* Custom Leaflet Marker Styling */
        .custom-marker { background: var(--ink); color: white; border: 2px solid white; border-radius: 50%; width: 36px !important; height: 36px !important; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: transform 0.2s, background 0.2s; cursor: pointer; }
        .custom-marker:hover, .custom-marker.playing { transform: scale(1.15); background: var(--red); border-color: var(--cream); }
        .leaflet-popup-content-wrapper { background: rgba(29, 32, 36, 0.9); color: white; border-radius: 12px; backdrop-filter: blur(8px); }
        .leaflet-popup-tip { background: rgba(29, 32, 36, 0.9); }
        .leaflet-popup-content { margin: 15px; font-family: "DM Sans", sans-serif; text-align: center; }
        .leaflet-popup-content strong { font-size: 16px; font-family: "Playfair Display", serif; display: block; margin-bottom: 4px;}
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-overlay">
        <div class="header-panel">
            <h1>The Acoustic Map</h1>
            <p>23 raw nature recordings from the Austrian Alps.</p>
        </div>
        <a href="/" class="btn-back">
            <i data-feather="arrow-left" style="width: 16px; height: 16px;"></i> Sound Generator
        </a>
    </div>

    <div class="now-playing" id="now-playing">
        <div class="sound-wave">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span id="playing-title" style="font-weight: 700; font-size: 14px;">Playing: River Flow</span>
        <button id="stop-btn" style="background:none; border:none; color:white; cursor:pointer; padding: 5px; margin-left: 10px;">
            <i data-feather="x-circle" style="width: 20px; height: 20px;"></i>
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        feather.replace();

        // 1. Initialize Map centered on Austria (Salzburg/Kaprun region)
        const map = L.map('map', { zoomControl: false }).setView([47.4, 13.0], 8);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. Add Lush Green Satellite Map (Esri World Imagery - FREE, NO API KEY)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            maxZoom: 18
        }).addTo(map);

        // 3. Global Audio Player
        let currentAudio = null;
        const nowPlayingWidget = document.getElementById('now-playing');
        const playingTitle = document.getElementById('playing-title');
        let activeMarker = null;

        // 4. The local Austrian sound collection
        const soundsData = [
            { id: 1, title: "Yodelling in the Alps", lat: 47.273, lng: 12.759, file: "collections/Yodelling/Yodelling.mp3" },
            { id: 2, title: "Dance Schuachplattler", lat: 47.450, lng: 12.800, file: "collections/Instruments/Dance Schuachplattler.mp3" },
            { id: 3, title: "Accordion in the Alps", lat: 47.380, lng: 12.650, file: "collections/Instruments/Accordion.mp3" },
            { id: 4, title: "Happy Alpine Beat", lat: 47.410, lng: 12.900, file: "collections/Beats/Happy.mp3" },
            { id: 5, title: "Hopeful Mountain Evening", lat: 47.320, lng: 12.796, file: "collections/Beats/Hopeful.mp3" },
            { id: 6, title: "Relaxed Summer Morning", lat: 47.420, lng: 13.000, file: "collections/Beats/Relaxed.mp3" },
            { id: 7, title: "Birds in the Meadow", lat: 47.150, lng: 13.100, file: "collections/Fauna/Birds.mp3" },
            { id: 8, title: "Cow Bells in the Valley", lat: 47.450, lng: 12.950, file: "collections/Fauna/Cow.mp3" },
            { id: 9, title: "Horses at a Mountain Farm", lat: 47.210, lng: 12.850, file: "collections/Fauna/Horses Galopp.mp3" },
            { id: 10, title: "Horses Whickering", lat: 47.180, lng: 13.250, file: "collections/Fauna/Horses whicker.mp3" },
            { id: 11, title: "Water by the Alps", lat: 47.100, lng: 12.750, file: "collections/Ambient/At the water.mp3" },
            { id: 12, title: "Bottles at an Alpine Table", lat: 47.300, lng: 12.950, file: "collections/Ambient/Bottles.mp3" },
            { id: 13, title: "Cheerful Alpine Crowd", lat: 47.350, lng: 13.300, file: "collections/Ambient/Cheerful crowd.mp3" },
            { id: 14, title: "Village Churchbells", lat: 47.323, lng: 12.796, file: "collections/Ambient/Churchbells.mp3" },
            { id: 15, title: "Evening Village Event", lat: 47.475, lng: 13.620, file: "collections/Ambient/Crowd Evening Event.mp3" },
            { id: 16, title: "Cutlery at a Mountain Restaurant", lat: 47.250, lng: 13.400, file: "collections/Ambient/Cutlery.mp3" },
            { id: 17, title: "Evening Mountain Wind", lat: 47.180, lng: 13.500, file: "collections/Ambient/Evening wind.mp3" },
            { id: 18, title: "Hiking in the Alps", lat: 47.074, lng: 12.694, file: "collections/Ambient/Hiking.mp3" },
            { id: 19, title: "Mountain Air", lat: 47.400, lng: 13.000, file: "collections/Ambient/Mountain Air.mp3" },
            { id: 20, title: "Vienna Tram", lat: 48.208, lng: 16.373, file: "collections/Ambient/Vienna Tram.mp3" },
            { id: 21, title: "Wineglass in Austria", lat: 48.250, lng: 15.600, file: "collections/Ambient/Wineglass.mp3" },
            { id: 22, title: "Winter Mountain Wind", lat: 47.280, lng: 12.700, file: "collections/Ambient/Winter wind.mp3" },
            { id: 23, title: "Main Alpine Song", lat: 47.200, lng: 13.050, file: "collections/Tracks/main song.mp3" }
        ];

        // 5. Custom Marker Icon HTML
        const createMarkerIcon = (file) => {
            const category = file.split('/')[1] || 'Ambient';
            const icons = {
                Ambient: `<path d="m3 18 6-8 4 5 2-3 6 6"></path><path d="M3 20h18"></path><path d="M17.5 8.5c1 .6 1 1.8 0 2.4"></path><path d="M19.5 6.5c2.7 1.6 2.7 4.8 0 6.4"></path>`,
                Beats: `<path d="M9 18V5l10-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="16" cy="16" r="3"></circle>`,
                Fauna: `<path d="M5 14c1.5-4 4.1-6 7-6s5.5 2 7 6"></path><path d="M8 10 6 7M16 10l2-3"></path><circle cx="9" cy="13" r=".7" fill="currentColor"></circle><circle cx="15" cy="13" r=".7" fill="currentColor"></circle><path d="M10 16c1.3 1 2.7 1 4 0"></path>`,
                Instruments: `<path d="M8 4v11"></path><path d="M8 4h7v4H8"></path><path d="M5 15h6a3 3 0 1 1-6 0Z"></path><path d="M15 8v8"></path><path d="M15 8h4"></path>`,
                Tracks: `<path d="m3 17 6-7 4 4 3-5 5 8"></path><path d="M3 20h18"></path><circle cx="18" cy="6" r="2"></circle>`,
                Yodelling: `<path d="M4 18c2-5 4-8 8-8s6 3 8 8"></path><path d="M7 18h10"></path><path d="M9 6h6"></path><path d="M12 6v4"></path>`
            };
            return L.divIcon({
            className: `custom-marker marker-${category.toLowerCase()}`,
            html: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[category] || icons.Ambient}</svg>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18]
            });
        };

        // 6. Plot Markers on Map
        const markers = [];
        soundsData.forEach(sound => {
            const marker = L.marker([sound.lat, sound.lng], { icon: createMarkerIcon(sound.file) }).addTo(map);
            markers.push(marker);
            
            marker.bindPopup(`<strong>${sound.title}</strong><span style="color:#aaa; font-size:12px; text-transform:uppercase;">Click to listen</span>`);

            marker.on('click', () => {
                // Stop previous audio
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                
                // Reset styling
                document.querySelectorAll('.custom-marker').forEach(el => el.classList.remove('playing'));
                
                // Highlight current marker
                marker.getElement().classList.add('playing');

                // Error Handling for Audio
                currentAudio = new Audio(encodeURI(sound.file));
                currentAudio.loop = true; 
                
                currentAudio.play().then(() => {
                    // Show UI Widget only if audio successfully plays
                    playingTitle.innerText = sound.title;
                    nowPlayingWidget.classList.add('active');
                }).catch(e => {
                    console.log("Audio file missing or blocked:", e);
                    playingTitle.innerText = "Error: File missing!";
                    nowPlayingWidget.classList.add('active');
                });
            });
        });

        // 7. Stop Button Logic
        document.getElementById('stop-btn').addEventListener('click', () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            document.querySelectorAll('.custom-marker').forEach(el => el.classList.remove('playing'));
            nowPlayingWidget.classList.remove('active');
        });

    </script>
</body>
</html>
